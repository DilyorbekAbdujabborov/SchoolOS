    <script>
      // Applied before React mounts so the page never flashes the wrong theme,
      // and so it never gets caught by a browser's own forced-dark rewriting
      // (which only applies to pages that don't declare their own scheme).
      (function () {
        var stored = localStorage.getItem("schoolos-theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
